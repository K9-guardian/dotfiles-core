# Reusable steps to:
# 1. Download a release archive with optional checksum validation
# 2. (Optional) Verify the archive's GPG signature
# 3. Extract it to a target directory
# 4. Symlink the main binary into a common bin directory
#
# Required variables:
#   archive_app_name       - Short name, e.g. "neovim", "kitty", "croc"
#   archive_url            - Full download URL
#   archive_install_dir    - Where to extract (e.g. /opt/kitty, /usr/local/neovim)
#   archive_extra_opts     - list of extra tar options (e.g. ["--strip-components=1"]) or []
#
# Optional variables:
#   archive_checksum       - Checksum for get_url (format: "sha256: URL" or raw hash)
#                            If empty/omitted, no checksum validation is performed.
#   archive_binary_subpath - Relative path inside install dir to the main executable
#                            (default: "bin/{{ archive_app_name }}")
#   archive_create_symlink - Boolean to create a symlink (defaults to true)
#   archive_symlink_name   - Name of the symlink in bin_dir (default: archive_app_name)
#   archive_become         - Whether to use become for directory creation, extraction,
#                            and cleanup (default: true)
#   archive_log_dir        - Name of the directory to store download logs for archives (default: ~/.archives)
#   bin_dir                - Directory for symlinks (default: ~/.bin)

- name: Store archive filename for later tasks
  ansible.builtin.set_fact:
    _archive_filename: "{{ archive_url | basename }}"

- name: Check if {{ archive_log_dir | default('~/.archives') }}/{{ archive_app_name }} exists
  ansible.builtin.stat:
    path: "{{ archive_log_dir | default('~/.archives') }}/{{ archive_app_name }}"
  register: _check_log_dir_file

- name: Read and decode {{ archive_app_name }} filename from {{ archive_log_dir | default('~/.archives') }}/{{ archive_app_name }}
  when: _check_log_dir_file.stat.exists
  block:
  - name: Read {{ archive_app_name }} filename from {{ archive_log_dir | default('~/.archives') }}/{{ archive_app_name }}
    ansible.builtin.slurp:
      src: "{{ archive_log_dir | default('~/.archives') }}/{{ archive_app_name }}"
    register: _previous_archive_filename_encoded

  - name: Decode {{ archive_app_name }} filename
    ansible.builtin.set_fact:
      _previous_archive_filename: >-
        {{ (_previous_archive_filename_encoded.content | b64decode | trim)
           if not _previous_archive_filename_encoded.failed else '' }}

- name: Install {{ archive_app_name }} archive
  when: _previous_archive_filename is not defined or _previous_archive_filename != _archive_filename
  block:
    - name: Download {{ archive_app_name }} archive
      ansible.builtin.get_url:
        url: "{{ archive_url }}"
        dest: "/tmp/{{ _archive_filename }}"
        checksum: "{{ archive_checksum | default(omit) }}"
      register: _download

    - name: Ensure install directory exists for {{ archive_app_name }}
      ansible.builtin.file:
        path: "{{ archive_install_dir }}"
        state: directory
        mode: '755'
      become: "{{ archive_become | default(true) }}"

    - name: "Extract {{ archive_app_name }} archive"
      when:
        - _download is succeeded
        - not ansible_check_mode
      ansible.builtin.unarchive:
        src: "/tmp/{{ _archive_filename }}"
        dest: "{{ archive_install_dir }}"
        remote_src: true
        extra_opts: "{{ archive_extra_opts | default([]) }}"
      become: "{{ archive_become | default(true) }}"

    - name: Remove temporary files for {{ archive_app_name }}
      when: not ansible_check_mode
      ansible.builtin.file:
        path: "/tmp/{{ _archive_filename }}"
        state: absent
      become: "{{ archive_become | default(true) }}"

    - name: Symlink {{ archive_app_name }} into {{ bin_dir | default('~/.bin') }}
      ansible.builtin.file:
        src: "{{ archive_install_dir }}/{{ archive_binary_subpath | default('bin/' + archive_app_name) }}"
        dest: "{{ bin_dir | default('~/.bin') }}/{{ archive_symlink_name | default(archive_app_name) }}"
        state: link
        force: true
      when: archive_create_symlink | default(true)

    - name: Write {{ _archive_filename }}  to {{ archive_log_dir | default('~/.archives')}}/{{ archive_app_name }}
      ansible.builtin.copy:
        content: "{{ _archive_filename }}"
        dest: "{{ archive_log_dir | default('~/.archives') }}/{{ archive_app_name }}"
