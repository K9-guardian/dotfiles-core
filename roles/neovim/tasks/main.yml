- name: Get neovim {{ neovim_release_tag_name }} information
  include_tasks: "../../tasks/github_release_asset.yml"
  vars:
    github_repo: "neovim/neovim"
    github_release_id: "{{ neovim_release_id }}"

- name: Install neovim {{ neovim_release_tag_name }} from tarball
  include_tasks: "../../tasks/install_tarball.yml"
  vars:
    tarball_app_name: neovim
    tarball_url: "{{ _gh_download_url }}"
    tarball_install_dir: "{{ neovim_install_dir }}"
    tarball_extra_opts:
      - "--strip-components=1"
    tarball_binary_subpath: "bin/nvim"
    tarball_symlink_name: "nvim"

- name: Ensure neovim config directory exists
  ansible.builtin.file:
    path: "~/.config/nvim"
    state: directory
    mode: '755'

- name: Stow neovim configuration
  ansible.builtin.command:
    cmd: >
      {{ ansible_facts.user_dir }}/.local/bin/stow --dotfiles --no-folding {{ stow_extra_args }}
      --dir={{ role_path }}/files
      --target={{ ansible_facts.user_dir }}/.config/nvim
      config
  changed_when: false

- name: Install tree-sitter CLI via dnf
  ansible.builtin.dnf:
    name:
      - gcc
      - tree-sitter-cli
    state: latest
  become: true
  when:
    - treesitter_install_method == "package"
    - ansible_facts.os_family == 'RedHat'

- name: Install tree-sitter CLI via brew
  community.general.homebrew:
    name: tree-sitter
    state: latest
  when:
    - treesitter_install_method == "package"
    - ansible_facts.os_family == 'Darwin'

- name: Install tree-sitter CLI via cargo
  community.general.cargo:
    name: tree-sitter-cli
    state: latest
  when:
    - treesitter_install_method == "cargo"

- name: Stow osc52 neovim configuration
  ansible.builtin.command:
    cmd: >
      {{ ansible_facts.user_dir }}/.local/bin/stow --dotfiles --no-folding {{ stow_extra_args }}
      --dir={{ role_path }}/files
      --target={{ ansible_facts.user_dir }}/.config/nvim
      osc52
  changed_when: false
  when: neovim_osc52_enabled

- name: Stow extra neovim configuration
  ansible.builtin.command:
    cmd: >
      {{ ansible_facts.user_dir }}/.local/bin/stow --dotfiles --no-folding {{ stow_extra_args }}
      --dir={{ neovim_extra_config }}
      --target={{ ansible_facts.user_dir }}/.config/nvim
      config
  changed_when: false
  when: neovim_extra_config | length > 0
