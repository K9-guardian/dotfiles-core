- name: Ensure directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
  loop:
    - "~/.tarballs"
    - "~/.bin"

- name: Download stow from archive
  include_tasks: "../../tasks/install_archive.yml"
  vars:
    archive_app_name: stow
    archive_url: "{{ stow_release_url }}"
    archive_install_dir: "{{ stow_source_dir }}"
    archive_extra_opts:
      - "--strip-components=1"
    archive_binary_subpath: "stow"
    archive_create_symlink: false
    archive_become: false

- name: Configure stow
  ansible.builtin.command:
    cmd: "./configure --prefix={{ ansible_facts.user_dir }}/.local"
    chdir: "{{ stow_source_dir }}"
  args:
    creates: "{{ stow_source_dir }}/Makefile"

- name: Build stow
  ansible.builtin.command:
    cmd: "make install"
    chdir: "{{ stow_source_dir }}"
  args:
    creates: "{{ ansible_facts.user_dir }}/.local/bin/stow"

- name: Install dependencies for stow
  ansible.builtin.dnf:
    name: perl-File-Copy
    state: latest
  become: true
  when: ansible_facts.os_family == 'RedHat'
