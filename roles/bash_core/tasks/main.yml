- name: Change login shell to /bin/bash
  when: ansible_facts.system == 'Darwin'
  ansible.builtin.command:
    cmd: "chsh -s /opt/homebrew/bin/bash {{ ansible_facts.user_id }}"
  become: true
  changed_when: false

- name: Copy bash configuration
  ansible.posix.synchronize:
    src: "config/"
    dest: "~"
    group: false
    times: false
    checksum: true
