- name: Get latest fzf information
  include_tasks: "../../tasks/github_release_asset.yml"
  vars:
    github_repo: "junegunn/fzf"

- name: Install fzf from archive
  include_tasks: "../../tasks/install_archive.yml"
  vars:
    archive_app_name: fzf
    archive_url: "{{ _gh_download_url }}"
    archive_install_dir: "{{ fzf_install_dir }}"
    archive_binary_subpath: "fzf"
    archive_symlink_name: "fzf"
